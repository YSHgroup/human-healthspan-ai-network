services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-healthspan}
      POSTGRES_USER: ${POSTGRES_USER:-healthspan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-healthspan_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - healthspan-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - healthspan-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  healthspan-postgres:
  healthspan-redis:
